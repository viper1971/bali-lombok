name: Vendor and optimize remote photographs
# Includes attributed Wikimedia NEST photo; preserves already migrated WebP records.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vendor-images.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vendor-images-main
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=11,<13'
      - run: python -m py_compile tools/vendor_images.py tools/audit_image_urls.py
      - name: Localize photography without rebuilding customized production scripts
        run: python tools/vendor_images.py
      - run: python tools/audit_image_urls.py
      - run: python tools/check_migrated_images.py
      - name: Validate syntax of deployed JS without changing their order
        run: |
          for file in assets/build/*.js; do node --check "$file" || exit 1; done
      - name: Upload diagnostic inventories
        uses: actions/upload-artifact@v4
        with:
          name: external-image-diagnostics
          path: |
            docs/external-image-inventory.json
            docs/external-image-migration.json
      - name: Commit imagery, rewritten paths and diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- .
          if ! git diff --cached --quiet; then
            git commit -m 'Localize and optimize remote photographs without altering page logic'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
