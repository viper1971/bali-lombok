name: Vendor and optimize remote photographs
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vendor-images.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=11,<13'
      - run: python -m py_compile tools/vendor_images.py
      - run: python tools/vendor_images.py
      - run: npm ci
      - run: python tools/build.py
      - run: npm test
      - name: Commit generated photos and rebuilt site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- .
          if ! git diff --cached --quiet; then
            git commit -m 'Vendor third-party photographs as optimized local WebP files'
            git push
          fi
