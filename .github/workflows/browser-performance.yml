name: BALI browser performance benchmark
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/browser-performance.yml'
      - 'tests/performance.cjs'
      - 'index.html'
      - 'assets/build/js-1650a00000000004.js'
      - 'assets/build/js-2a84e1c14c764d64.js'
      - 'assets/data/gallery-catalog.js'
      - 'tests/editorial-lazy.cjs'
      - 'tests/magazine-cls.cjs'
      - 'tests/magazine-presentation.cjs'
      - 'assets/js/068-magazine-layout.js'
      - 'assets/build/js-head-critical-a-20261105.js'
      - 'assets/native-scroll-20261105.css'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify lazy images and stable magazine presentation
        run: node tests/editorial-lazy.cjs && node tests/gallery-lazy.cjs && node tests/gallery-local.cjs && node tests/magazine-cls.cjs
      - name: Verify magazine entry on desktop and mobile
        run: node tests/magazine-presentation.cjs
      - name: Measure desktop and mobile page load
        run: node tests/performance.cjs
      - name: Archive performance metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-performance
          path: docs/performance-metrics.json
          if-no-files-found: warn
      - name: Save results to repository (including failed performance checks)
        if: always() && hashFiles('docs/performance-metrics.json') != ''
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/performance-metrics.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record mobile and desktop synthetic browser measurements'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
