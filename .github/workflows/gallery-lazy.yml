name: BALI gallery loading regression
on:
  push:
    branches: [main]
    paths:
      - 'assets/js/047.js'
      - 'assets/build/js-2a84e1c14c764d64.js'
      - 'index.html'
      - 'tests/gallery-lazy.cjs'
      - '.github/workflows/gallery-lazy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check preserved gallery interactivity and lazy loading
        run: node tests/gallery-lazy.cjs
