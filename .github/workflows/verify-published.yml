name: Build and performance regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify reproducible optimized build
        run: |
          npm run build
          npm run build:check
          git diff --exit-code -- src/index.html index.html sw.js assets/build-manifest.json
      - name: Run static, map and appearance regression tests
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run real-browser regression on mobile and desktop
        run: npm run test:browser
      - name: Measure mobile and desktop synthetic performance
        run: npm run test:performance
      - name: Upload browser and performance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bali-browser-performance
          path: |
            test-results/
            docs/performance-metrics.json
            docs/performance-summary.md
          retention-days: 14
