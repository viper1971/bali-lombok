name: Mirror licensed Wikimedia slideshow photos
# Retry four remaining licensed photo topics using Indonesian place-name aliases.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vendor-gallery-photos.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gallery-photo-cache
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=11,<13'
      - run: python -m py_compile tools/vendor_dynamic_galleries.py
      - name: Cache licensed Commons images with attribution
        run: python tools/vendor_dynamic_galleries.py
      - name: Validate local catalog syntax
        run: node --check assets/data/gallery-catalog.js
      - name: Verify local gallery licenses and paths
        run: node tests/gallery-local.cjs
      - name: Archive license and missing-image report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-licensing-report
          path: docs/dynamic-gallery-migration.json
          if-no-files-found: warn
      - name: Publish catalog and photographs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- assets/images/gallery assets/data/gallery-catalog.js docs/dynamic-gallery-migration.json docs/gallery-photo-credits.md src/index.html index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Cache Wikimedia itinerary photographs with credits'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
