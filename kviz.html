<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kdo zná naši dovolenou nejlépe? | BALI 2027</title><style>:root{font-family:system-ui,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1e615d,#081b27 70%);color:#fff;min-height:100vh}main{max-width:760px;margin:auto;padding:28px 18px 70px}a{color:#ffe19a}.panel{background:#102b38ee;border:1px solid #ffffff30;border-radius:22px;padding:26px;box-shadow:0 15px 50px #0005}h1{font-size:clamp(28px,6vw,48px);line-height:1.1;margin:14px 0}h2{line-height:1.3}p{line-height:1.6;color:#d6e7e8}.meta{color:#ffd98b;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.answers{display:grid;gap:12px;margin-top:25px}button{cursor:pointer;border:1px solid #ffffff50;border-radius:14px;background:#204658;color:white;padding:17px;text-align:left;font:inherit;font-weight:700;min-height:54px}button:hover:not(:disabled){background:#356e7b}button:disabled{cursor:default;opacity:.85}button.correct{background:#166a4a;border-color:#7ff3a7}button.wrong{background:#843e43;border-color:#ffb0b0}.primary{background:#e8b75c;color:#172c32;border:0;text-align:center}.primary:hover{background:#f7cd7c!important}.bar{height:9px;background:#ffffff2a;border-radius:9px;overflow:hidden;margin:16px 0}.fill{height:100%;background:#e8b75c;transition:width .2s}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.muted{color:#b4c8cc}input{width:100%;padding:14px;border-radius:12px;border:1px solid #fff7;background:#0c2632;color:#fff;font:inherit;margin:12px 0}.leader{padding-left:25px;line-height:2}#feedback{min-height:40px}footer{margin-top:22px;text-align:center}</style></head><body><main><a href="./index.html">← Zpět na itinerář</a><section class="panel" id="app"></section><footer>BALI &amp; LOMBOK 2027 · Cestovatelská výzva</footer></main><script>const Q=[["Kdy začíná naše cesta v roce 2027?",["6. srpna","6. července","15. srpna","25. srpna"],0,"Cesta je plánována od 6. do 25. srpna 2027."],["Kdy končí naše cesta?",["20. srpna","25. srpna","30. srpna","6. září"],1,"Plánovaný konec cesty je 25. srpna."],["Které město navštívíme před Bali?",["Bangkok","Kuala Lumpur","Singapur","Jakarta"],2,"První zastávkou je Singapur."],["Které dva indonéské ostrovy jsou hlavními cíli?",["Jáva a Sumatra","Bali a Lombok","Borneo a Flores","Bali a Jáva"],1,"Naše cesta vede na Bali a Lombok."],["Které z těchto míst leží na Bali?",["Ubud","Mataram","Gili Air","Singapur"],0,"Ubud je známá oblast ve vnitrozemí Bali."],["Která oblast Bali je známá útesy a surfováním?",["Uluwatu","Lovina","Sanur","Ubud"],0,"Uluwatu leží na jihu Bali."],["Které z těchto míst je na Lomboku?",["Kuta Lombok","Kuta Bali","Seminyak","Canggu"],0,"Kuta Lombok se nachází na jihu Lomboku."],["Jaká je hlavní podoba našeho webu?",["Cestovatelský časopis","E-shop","Sportovní výsledky","Hudební přehrávač"],0,"Itinerář je zpracován v časopisovém stylu."],["Co na webu pomáhá s orientací v místech?",["Mapy a Street View","Jízdní řády metra v Praze","Televizní program","Burzovní grafy"],0,"Na stránce jsou mapy a pohledy Street View."],["Co si můžeme prohlížet v režimu celé obrazovky?",["Mapy","Pouze nadpis","Pouze datum","Jen rozpočet"],0,"Mapy mají režim fullscreen."],["Který stát navštívíme kromě Indonésie?",["Singapur","Vietnam","Nepál","Japonsko"],0,"Součástí itineráře je Singapur."],["Která z těchto oblastí je v itineráři?",["Uluwatu","Hanoj","Phuket","Čiang Mai"],0,"Uluwatu patří mezi zastávky."],["Na jaký rok je plánovaná dovolená?",["2025","2026","2027","2028"],2,"Náš cestovní projekt je BALI & LOMBOK 2027."],["Jaké téma má hra?",["Znalost naší dovolené","Fotbalová liga","Filmové premiéry","České hrady"],0,"Hra testuje znalost našeho cestovatelského plánu."],["Kde leží Ubud?",["Na Bali","V Singapuru","Na Lomboku","V Thajsku"],0,"Ubud je na ostrově Bali."],["Co je v itineráři plánováno?",["Lety, ubytování a přesuny","Pouze lety","Jen hotely","Jen restaurace"],0,"Web sdružuje plán cesty, dopravu i ubytování."]];const app=document.getElementById('app');let deck=[],idx=0,score=0,timer=null,remaining=15,locked=false;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function board(){try{return JSON.parse(localStorage.getItem('bali-quiz-leaders')||'[]')}catch{return []}}function save(name){try{let b=board();b.push({name:name.slice(0,25),score,date:new Date().toLocaleDateString('cs-CZ')});b.sort((a,b)=>b.score-a.score);localStorage.setItem('bali-quiz-leaders',JSON.stringify(b.slice(0,10)))}catch{}}function home(){clearInterval(timer);app.innerHTML='<div class="meta">Velká cestovatelská výzva</div><h1>Kdo zná naši dovolenou nejlépe?</h1><p>Singapur · Bali · Lombok. Odpověz na 12 náhodně vybraných otázek. Na každou máš 15 sekund. Za rychlé a správné odpovědi získáš více bodů.</p><button class="primary" id="start">Zahrát si</button><h2>Žebříček hráčů</h2><div id="leaders"></div>';document.getElementById('start').onclick=start;let b=board();document.getElementById('leaders').innerHTML=b.length?'<ol class="leader">'+b.map(x=>'<li>'+esc(x.name)+' — <strong>'+x.score+' bodů</strong> <span class="muted">('+esc(x.date)+')</span></li>').join('')+'</ol>':'<p>Zatím žádné výsledky. Buď první!</p>'}function start(){deck=Q.map((q,i)=>({q,i})).sort(()=>Math.random()-.5).slice(0,12);idx=0;score=0;show()}function show(){clearInterval(timer);locked=false;remaining=15;let q=deck[idx].q;let order=[0,1,2,3].sort(()=>Math.random()-.5);app.innerHTML='<div class="top"><span class="meta">Otázka '+(idx+1)+' / 12</span><strong>Skóre: <span id="score">'+score+'</span></strong><strong>Čas: <span id="time">15</span> s</strong></div><div class="bar"><div class="fill" style="width:'+((idx)/12*100)+'%"></div></div><h2>'+esc(q[0])+'</h2><div class="answers">'+order.map(i=>'<button data-a="'+i+'">'+esc(q[1][i])+'</button>').join('')+'</div><p id="feedback" aria-live="polite"></p><button class="primary" id="next" hidden>Pokračovat</button>';app.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.a)));document.getElementById('next').onclick=()=>{idx++;idx===deck.length?finish():show()};timer=setInterval(()=>{remaining--;document.getElementById('time').textContent=remaining;if(remaining<=0)answer(-1)},1000)}function answer(a){if(locked)return;locked=true;clearInterval(timer);let q=deck[idx].q,good=a===q[2];if(good)score+=100+remaining*10;app.querySelectorAll('[data-a]').forEach(b=>{b.disabled=true;if(Number(b.dataset.a)===q[2])b.classList.add('correct');else if(Number(b.dataset.a)===a)b.classList.add('wrong')});document.getElementById('score').textContent=score;document.getElementById('feedback').textContent=(good?'Správně! ':a<0?'Čas vypršel. ':'Nesprávně. ')+q[3];let next=document.getElementById('next');next.hidden=false;next.textContent=idx===deck.length-1?'Zobrazit výsledek':'Další otázka'}function finish(){clearInterval(timer);app.innerHTML='<div class="meta">Konec hry</div><h1>Tvůj výsledek: '+score+' bodů</h1><p>Zapiš své jméno do žebříčku na tomto zařízení.</p><label for="player">Jméno hráče</label><input id="player" maxlength="25" placeholder="Tvoje jméno"><button class="primary" id="save">Uložit výsledek</button> <button id="again">Hrát znovu</button>';document.getElementById('save').onclick=()=>{let name=document.getElementById('player').value.trim()||'Cestovatel';save(name);home()};document.getElementById('again').onclick=start}home();</script></body></html>
